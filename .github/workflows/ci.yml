name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Restore Core Tests
        run: dotnet restore tests/HotMic.Core.Tests/HotMic.Core.Tests.csproj

      - name: Build Common
        run: dotnet build src/HotMic.Common/HotMic.Common.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build Core
        run: dotnet build src/HotMic.Core/HotMic.Core.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build Core Tests
        run: dotnet build tests/HotMic.Core.Tests/HotMic.Core.Tests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test Core
        run: dotnet test tests/HotMic.Core.Tests/HotMic.Core.Tests.csproj -c Release --no-build --verbosity normal

  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Restore Desktop Projects
        run: dotnet restore src/HotMic.App/HotMic.App.csproj --locked-mode -r win-x64

      - name: Build VST Host
        run: dotnet build src/HotMic.Vst3/HotMic.Vst3.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build Desktop App
        run: dotnet build src/HotMic.App/HotMic.App.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Resolve Package Metadata
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: package
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }

            "version=$version" >> $env:GITHUB_OUTPUT
            "portable=publish/HotMic-$version-win-x64-portable.zip" >> $env:GITHUB_OUTPUT
            "installer=publish/HotMic-$version-Setup.exe" >> $env:GITHUB_OUTPUT
          }
          else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            "version=0.0.0-ci" >> $env:GITHUB_OUTPUT
            "portable=publish/HotMic-main-$shortSha-win-x64-portable.zip" >> $env:GITHUB_OUTPUT
            "installer=publish/HotMic-main-$shortSha-Setup.exe" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Desktop App
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: >
          dotnet publish src/HotMic.App/HotMic.App.csproj
          -c Release
          -r win-x64
          --no-restore
          --self-contained false
          -p:Version=${{ steps.package.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o publish/app

      - name: Detect Published App Host
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: appinfo
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/app -Filter *.exe |
            Where-Object { $_.Name -notlike "createdump.exe" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No published application executable found."
          }

          "app_exe=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Build Portable Zip
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: Compress-Archive -Path publish/app/* -DestinationPath "${{ steps.package.outputs.portable }}"

      - name: Install NSIS
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: choco install nsis -y

      - name: Build Installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe not found after NSIS installation."
          }

          $publishDir = (Resolve-Path "publish/app").Path
          $outputName = Join-Path (Resolve-Path "publish").Path (Split-Path "${{ steps.package.outputs.installer }}" -Leaf)

          & $makensis /V3 `
            /DAPP_VERSION=${{ steps.package.outputs.version }} `
            /DAPP_EXE=${{ steps.appinfo.outputs.app_exe }} `
            /DOUTPUT_NAME=$outputName `
            /DPUBLISH_DIR=$publishDir `
            build/installer/HotMic.nsi

      - name: Upload Portable Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: HotMic-Portable
          path: ${{ steps.package.outputs.portable }}

      - name: Upload Installer Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: HotMic-Installer
          path: ${{ steps.package.outputs.installer }}

      - name: Update Rolling Release Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f main-latest ${{ github.sha }}
          git push origin refs/tags/main-latest --force

      - name: Publish Rolling GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: HotMic Main (Rolling)
          prerelease: true
          make_latest: false
          body: |
            Rolling prerelease from `main`.

            Commit: `${{ github.sha }}`

            Downloads:
            - `${{ steps.package.outputs.portable }}` - portable framework-dependent build
            - `${{ steps.package.outputs.installer }}` - NSIS installer
          files: |
            ${{ steps.package.outputs.portable }}
            ${{ steps.package.outputs.installer }}

      - name: Publish Tagged GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HotMic v${{ steps.package.outputs.version }}
          body: |
            ## Downloads
            - `${{ steps.package.outputs.portable }}` - portable framework-dependent build
            - `${{ steps.package.outputs.installer }}` - NSIS installer
          files: |
            ${{ steps.package.outputs.portable }}
            ${{ steps.package.outputs.installer }}

  report:
    if: always()
    needs: [core, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Summarize Workflow Result
        id: summary
        shell: bash
        run: |
          core='${{ needs.core.result }}'
          desktop='${{ needs.desktop.result }}'

          if [[ "$core" == "cancelled" || "$desktop" == "cancelled" ]]; then
            status="cancelled"
          elif [[ "$core" == "success" && "$desktop" == "success" ]]; then
            status="success"
          else
            status="failure"
          fi

          if [[ "$core" == "success" ]]; then
            test_passed="true"
          else
            test_passed="false"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "test_passed=$test_passed" >> "$GITHUB_OUTPUT"

      - uses: chris-arsenault/platform/.github/actions/report-build@main
        with:
          status: ${{ steps.summary.outputs.status }}
          test-passed: ${{ steps.summary.outputs.test_passed }}
